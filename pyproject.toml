# Dev-only: tests and lint. The script itself is standalone: its dependencies are in
# the "# /// script" header of checkuser.py (keep both lists in step).
[project]
name = "checkuser"
version = "0.4.0"
description = "Room headcount logger for Habbo (G-Earth extension)"
requires-python = ">=3.11"
dependencies = [
    # 0.1.6 is the last working release; G-Python's GitHub main has a circular import.
    "g-python==0.1.6",
    "pydantic>=2.0",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["."]
# g-python 0.1.6 compares strings with `is not`, which warns on Python 3.12+.
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
# S101: assert is fine in tests. E501: `ruff format` keeps code within line-length.
ignore = ["S101", "E501"]
